<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Site Recce Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: single mobile column, sticky section tabs, field-notebook cards; submissions list as a second view */
:root{
  --bg:#f5f6f1; --surface:#ffffff; --ink:#1f2a1f; --muted:#5f6a5c; --line:#dde1d5;
  --accent:#2f5d3a; --accent-ink:#ffffff; --maize:#e8b931; --maize-soft:#fbf1d2;
  --danger:#b3412e; --chip:#eef1e8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a15; --surface:#1c241d; --ink:#e7ece3; --muted:#9aa696; --line:#2e3a2f;
  --accent:#7fb98b; --accent-ink:#0f1a11; --maize:#e8b931; --maize-soft:#3a3218;
  --danger:#ef8a76; --chip:#253026; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141a15; --surface:#1c241d; --ink:#e7ece3; --muted:#9aa696; --line:#2e3a2f;
  --accent:#7fb98b; --accent-ink:#0f1a11; --maize:#e8b931; --maize-soft:#3a3218;
  --danger:#ef8a76; --chip:#253026; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto}
header.top{padding-block:20px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font:700 26px/1.1 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.views{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.views button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;margin-bottom:4px}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-block:14px;display:flex;flex-direction:column;gap:18px;scroll-margin-top:60px}
.sec-head{display:flex;gap:10px;align-items:baseline}
.sec-letter{font:700 13px var(--display);background:var(--maize);color:#2a2205;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
h2{font:700 19px/1.2 var(--display);margin:0}
.q{display:flex;flex-direction:column;gap:8px}
.q > label, .q > .ql{font-weight:600;font-size:14.5px}
.hint{color:var(--muted);font-size:12.5px;font-weight:400}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%;font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
textarea{min-height:72px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-block;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:14px;cursor:pointer;user-select:none}
.chip input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ff-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.ff-row .lbl{font-size:13.5px;color:var(--muted)}
.gen-block{border-left:3px solid var(--maize);padding-left:12px;display:flex;flex-direction:column;gap:10px}
.gen-block h3{font:700 15px var(--display);margin:0;display:flex;justify-content:space-between;gap:8px}
.gen-block h3 .hint{font-family:var(--body)}
.entry{background:var(--maize-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.entry-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.entry label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.entry input,.entry select{background:var(--surface)}
.link{background:none;border:0;color:var(--accent);font:600 13.5px var(--body);cursor:pointer;padding:4px 0;align-self:flex-start}
.rm{background:none;border:0;color:var(--danger);font:600 12px var(--body);cursor:pointer;text-transform:none;letter-spacing:0}
.empty-note{color:var(--muted);font-size:13.5px;background:var(--chip);padding:10px 12px;border-radius:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .status{flex:1;font-size:12.5px;color:var(--muted);min-width:0}
.btn{border:0;border-radius:10px;padding:12px 18px;font:600 15px var(--body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--danger);font-size:13px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* submissions */
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sub-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.sub-card button.open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.sub-card .t{font:700 16px var(--display)}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;background:var(--chip);padding:3px 8px;border-radius:999px}
.tag.warn{background:var(--maize-soft)}
.detail{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.detail h4{margin:0 0 4px;font:700 13px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dl{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:4px 12px}
.dl dt{color:var(--muted)} .dl dd{margin:0;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th{color:var(--muted);font-weight:600}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ph{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.cmp th{text-align:left;color:var(--muted);font-weight:600}
.cmp tr.diff td,.cmp tr.diff th{background:var(--maize-soft);font-weight:700;color:var(--ink)}
input[type=file]{font:14px var(--body);color:var(--ink)}
.sec-head .hint{margin-left:auto}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Site Recce Checklist</h1>
      <div class="sub">One full form per site. Repeat visits only need the short visit questions.</div>
    </div>
    <div class="views" role="group" aria-label="View">
      <button id="v-form" aria-pressed="true">New visit</button>
      <button id="v-list" aria-pressed="false">Submitted <span id="count"></span></button>
    </div>
  </header>

  <div id="formView">
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <form id="form" novalidate></form>
  </div>

  <div id="listView" hidden>
    <div class="toolbar">
      <span class="meta" id="listMeta">Loading submissions…</span>
      <button class="btn ghost" id="exportBtn" hidden>Download CSV</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="bar" id="bar">
  <div class="in">
    <div class="status" id="status">Draft saves on this phone as you type.</div>
    <button class="btn ghost" id="resetBtn" type="button">Clear</button>
    <button class="btn primary" id="submitBtn" type="button">Submit</button>
  </div>
</div>

<script>
window.addEventListener('error',function(e){var b=document.getElementById('form');if(b&&!b.children.length)b.innerHTML='<p style="color:#b3412e;padding:12px">Script error: '+String(e.message).replace(/</g,'&lt;')+'</p>';});

/* ---------- schema ---------- */
const GENERATORS = [
  {k:'offices', l:'Offices', radius:'within 2 km', fields:[
    {k:'name', l:'Office / tech park name', ph:'e.g. Westgate, SG Highway'},
    {k:'dist', l:'Distance from site (km)', t:'num'},
    {k:'headcount', l:'Approx. headcount', t:'num'},
    {k:'timings', l:'Office timings & WFO days', ph:'9:30–6:30, WFO Tue–Thu'}]},
  {k:'colleges', l:'Colleges', radius:'within 4 km', fields:[
    {k:'name', l:'College name'},
    {k:'dist', l:'Distance from site (km)', t:'num'},
    {k:'timings', l:'Campus timings', ph:'8am – 3pm'}]},
  {k:'residential', l:'Residential', radius:'within 2 km', fields:[
    {k:'name', l:'Building / society name'},
    {k:'dist', l:'Distance from site (km)', t:'num'},
    {k:'band', l:'Income / rent band', t:'sel', opts:['Low','Lower-middle','Middle','Upper-middle','High']}]},
  {k:'tourist', l:'Tourist spot', radius:'within 2 km', fields:[
    {k:'name', l:'Spot name'},
    {k:'dist', l:'Distance from site (km)', t:'num'},
    {k:'peak', l:'Peak days & times', ph:'Sat–Sun, 5–9pm'}]},
  {k:'commuters', l:'Commuters (stations)', radius:'within 2 km', fields:[
    {k:'name', l:'Station / stop name', ph:'Metro, railway or bus'},
    {k:'dist', l:'Distance from site (km)', t:'num'},
    {k:'peak', l:'Peak commute hours', ph:'8–10am, 6–8pm'},
    {k:'side', l:'Outlet on home-going side?', t:'sel', opts:['Yes','No','Not sure']}]},
  {k:'hospitals', l:'Hospitals', radius:'within 2 km', fields:[
    {k:'name', l:'Hospital name'},
    {k:'dist', l:'Distance from site (km)', t:'num'},
    {k:'beds', l:'Approx. beds', t:'num'},
    {k:'opd', l:'OPD timings', ph:'9am – 1pm'}]},
];
const FOOTFALL = ['Low','Medium','High'];
const MAIN_FOOTFALL = ['Families','Students','Office crowd','Transient'];
const SIGNAGE = ['Visible from both','Only from road','Only from approach direction','Poor'];
const INDIRECT = ['QSR','Cafes','Cloud kitchens','Canteens'];
const SOURCES = ['Talked to staff','Counter observation','Delivery-app volume','Broker','Mystery shopping'];
const COMP_FIELDS = [
  {k:'name', l:'Competitor name'},
  {k:'kind', l:'Type', t:'sel', opts:['Direct','Indirect']},
  {k:'dist', l:'Distance from site (km)', t:'num'},
  {k:'ads', l:'ADS (₹ / day)', t:'num'},
  {k:'monthly', l:'Monthly sales (₹)', t:'num'},
  {k:'delivery', l:'% sales from delivery', t:'num'},
  {k:'dinein', l:'% sales from dine-in', t:'num'},
  {k:'source', l:'Source of these numbers', t:'sel', opts:SOURCES},
];
const SAFETY = ['Poor','Okay','Good'];
function getP(path){ return path.split('.').reduce((o,k)=>o==null?o:o[k], S); }
function setP(path,v){ const ks=path.split('.'); let o=S; ks.slice(0,-1).forEach(k=>{ if(o[k]==null) o[k]={}; o=o[k]; }); o[ks.at(-1)]=v; }

/* ---------- render helpers ---------- */
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idOf = p => 'f-'+p.replace(/\./g,'-');
function input(path, {t, ph, opts}={}){
  const v = getP(path) ?? '';
  const id = idOf(path);
  if(t==='sel') return `<select id="${id}" data-b="${path}"><option value="">Select…</option>${opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if(t==='area') return `<textarea id="${id}" data-b="${path}" placeholder="${esc(ph||'')}">${esc(v)}</textarea>`;
  const type = t==='num'?'number':(t||'text');
  return `<input id="${id}" type="${type}" ${t==='num'?'inputmode="decimal" step="any" min="0"':''} data-b="${path}" value="${esc(v)}" placeholder="${esc(ph||'')}">`;
}
function chips(path, opts, multi=true){
  const cur = getP(path);
  return `<div class="chips">${opts.map((o,i)=>{
    const on = multi ? (cur||[]).includes(o) : cur===o;
    return `<label class="chip"><input type="${multi?'checkbox':'radio'}" name="${path}" id="${idOf(path)}-${i}" data-c="${path}" data-m="${multi?1:0}" value="${esc(o)}"${on?' checked':''}><span>${esc(o)}</span></label>`;
  }).join('')}</div>`;
}
function entries(listPath, fields, noun){
  const rows = getP(listPath) || [];
  return rows.map((r,i)=>`<div class="entry">
      <div class="entry-top"><span>${noun} ${i+1}</span>${rows.length>1?`<button type="button" class="rm" data-rm="${listPath}" data-i="${i}">Remove</button>`:''}</div>
      <div class="grid2">${fields.map(f=>`<label${f.k==='name'?' style="grid-column:1/-1"':''}>${esc(f.l)}${input(`${listPath}.${i}.${f.k}`, f)}</label>`).join('')}</div>
    </div>`).join('') + `<button type="button" class="link" data-add="${listPath}">+ Add another ${noun.toLowerCase()}</button>`;
}

/* ---------- new schema ---------- */
const FLOORS=['Basement','Ground','First','Second+'], YN3=['Yes','No','Not sure'],
 BLDG=['Residential tower','Commercial tower','Standalone shopfront','Mall / other'],
 MEDIAN=['No median','Blocks cross traffic','Partial gap'], OBSTRUCT=['Trees','Hoardings','Flyover pillars','None'],
 FRONTAGE=['Hawker encroachment','Parking blocking frontage','None'], PARK=['Easy','Limited','None'],
 DAYS=['Weekday','Weekend'], MODES=['New site','Repeat visit'];
const TEN_FIELDS=[{k:'name',l:'Shop / business'},{k:'area',l:'Area (sq ft)',t:'num'},{k:'rent',l:'Rent (₹ / month)',t:'num'},{k:'source',l:'Source',t:'sel',opts:['Tenant','Broker','Owner','Estimate']}];
const SITE_KEYS=['signage','obstruct','waterlog','waterlogNote','generators','gen','directNearby','indirectTypes','competitors','changes','risks','ownStoreKm','facadeW','facadeH','floors','backDoor','bldg','tenants','lastTenant','lastStay','whyLeft','vacant','seatIn','seatOut','outdoorOk','median','uturn','parkTw','parkCar','parkSlots','ductFan','ductFanNote'];
const VISIT_KEYS=['dayType','footfall','mainFootfall','frontage','safety','visitNotes','photos','driveLink'];

/* ---------- state ---------- */
const today=()=>new Date().toISOString().slice(0,10);
const dayOf=d=>{const w=new Date(d+'T00:00').getDay();return(w===0||w===6)?'Weekend':'Weekday'};
function blank(){
  return {mode:'New site',siteId:'',editSite:false,
    meta:{bd:'',date:today(),time:'',site:'',address:'',location:'',maps:''},dayType:dayOf(today()),photos:[],driveLink:'',
    footfall:{morning:'',lunch:'',evening:'',dinner:''},mainFootfall:[],signage:'',obstruct:[],frontage:[],safety:'',visitNotes:'',
    generators:[],gen:{},directNearby:'',indirectTypes:[],competitors:[{}],changes:'',risks:{has:'',details:''},ownStoreKm:'',
    waterlog:'',waterlogNote:'',facadeW:'',facadeH:'',floors:[],backDoor:'',bldg:'',ductFan:'',ductFanNote:'',tenants:[{}],lastTenant:'',lastStay:'',whyLeft:'',vacant:'',
    seatIn:'',seatOut:'',outdoorOk:'',median:'',uturn:'',parkTw:'',parkCar:'',parkSlots:''};
}
let S=blank();
try{const d=localStorage.getItem('recce-draft-v2');if(d)S=Object.assign(blank(),JSON.parse(d));}catch(e){}
const saveDraft=()=>{try{localStorage.setItem('recce-draft-v2',JSON.stringify(S))}catch(e){}};
let sites=[],visits=[];
const keep=()=>{const y=scrollY;render();scrollTo(0,y)};
const pick=(o,ks)=>Object.fromEntries(ks.filter(k=>o[k]!==undefined).map(k=>[k,o[k]]));
function switchMode(m){S=Object.assign(blank(),{mode:m,meta:{...blank().meta,bd:S.meta.bd}});saveDraft();render();}
function pickSite(id){
  const s=sites.find(x=>x.id===id), b=blank();
  S=Object.assign(b,{mode:'Repeat visit',siteId:s?id:'',meta:{...b.meta,bd:S.meta.bd,date:S.meta.date,time:S.meta.time,site:s?.meta?.site||'',address:s?.meta?.address||'',location:s?.meta?.location||'',maps:s?.meta?.maps||''},dayType:S.dayType},s?pick(s,SITE_KEYS):{});
  saveDraft();render();
}

/* ---------- render ---------- */
function render(){
  const rep=S.mode==='Repeat visit', ready=!rep||S.siteId, full=ready&&(!rep||S.editSite);
  let n=0; const N=()=>(++n)+'. ';
  const genBlocks=S.generators.length?GENERATORS.filter(g=>S.generators.includes(g.k)).map(g=>{
    if(!S.gen[g.k]||!S.gen[g.k].length)S.gen[g.k]=[{}];
    return `<div class="gen-block"><h3>${esc(g.l)} <span class="hint">${g.radius}</span></h3>${entries('gen.'+g.k,g.fields,g.l==='Commuters (stations)'?'Station':g.l.replace(/s$/,'').replace('Residential','Residence'))}</div>`;
  }).join(''):`<div class="empty-note">Pick the generators above. Follow-up questions appear for each one.</div>`;
  const siteSel=`<select id="f-siteId" data-b="siteId"><option value="">Select site…</option>${sites.map(s=>`<option value="${esc(s.id)}"${s.id===S.siteId?' selected':''}>${esc(s.meta?.site||s.id)}</option>`).join('')}</select>`;
  const photoBlock=`<div class="q"><label for="f-files">Photos / videos <span class="hint">frontage, both road directions, interior</span></label>
    <div class="grid2"><button type="button" id="open-camera">Open camera</button><label>Choose photos / videos<input type="file" id="f-files" accept="image/*,video/*" multiple></label></div>${input('driveLink',{t:'url',ph:'Videos over 20 MB: paste a Drive folder link'})}
    <div class="thumbs">${S.photos.map(p=>`<span class="tag">${esc(p.name)} <button type="button" class="rm" data-ph="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">✕</button></span>`).join('')}</div></div>`;
  const q=(label,body)=>`<div class="q"><span class="ql">${N()}${label}</span>${body}</div>`;
  const fl=(label,path,o)=>`<div class="q"><label for="${idOf(path)}">${label}</label>${input(path,o)}</div>`;

  document.getElementById('form').innerHTML=`
  <section class="card" id="sec-visit">
    <div class="sec-head"><h2>Visit details</h2></div>
    <div class="q"><span class="ql">New site or repeat visit?</span>${chips('mode',MODES,false)}</div>
    ${rep?`<div class="q"><label for="f-siteId">Site *</label>${siteSel}</div>`
      :`${fl('Site name *','meta.site',{ph:'e.g. Prahlad Nagar corner unit'})}${fl('Site address *','meta.address',{ph:'Building, street, area'})}${fl('Site location / area *','meta.location',{ph:'Locality, city'})}
        <div class="q"><label for="f-meta-maps">Google Maps pin * <span class="hint">paste the share link</span></label>${input('meta.maps',{t:'url',ph:'https://maps.app.goo.gl/…'})}</div>`}
    ${rep&&S.siteId?`<label class="chip"><input type="checkbox" id="f-edit"${S.editSite?' checked':''}><span>Also update site details</span></label>${S.editSite?`${fl('Site address *','meta.address')}${fl('Site location / area *','meta.location')}<div class="q"><label for="f-meta-maps">Google Maps pin *</label>${input('meta.maps',{t:'url',ph:'https://maps.app.goo.gl/…'})}</div>`:''}`:''}
    ${ready?`<div class="grid2">${fl('BD executive *','meta.bd')}${fl('Visit date *','meta.date',{t:'date'})}${fl('Visit time','meta.time',{t:'time'})}</div>
    <div class="q"><span class="ql">Visit day *</span>${chips('dayType',DAYS,false)}<span class="hint">Set from the date. Change if needed.</span></div>
    ${photoBlock}`:'<div class="empty-note">Pick the site you are revisiting.</div>'}
  </section>

  ${full?`<section class="card" id="sec-a">
    <div class="sec-head"><span class="sec-letter">A</span><h2>Demand catchment</h2></div>
    ${q('What demand generators are around this site? <span class="hint">Select all</span>',chips('generators',GENERATORS.map(g=>g.l)))}
    ${genBlocks}
  </section>`:''}

  ${ready?`<section class="card" id="sec-b">

    ${tens.length?tbl(TEN_FIELDS.map(f=>f.l),tens.map(r=>[E(r.name),E(r.area),fmtINR(r.rent),E(r.source)])):''}</div>

    ${comps.length?tbl(['Name','Type','Dist km','ADS','Monthly','Delivery %','Dine-in %','Source'],comps.map(c=>[E(c.name),E(c.kind),E(c.dist),fmtINR(c.ads),fmtINR(c.monthly),E(c.delivery),E(c.dinein),E(c.source)])):''}</div>
    <div><h4>Risks</h4>${dl([['Upcoming changes',E(s.risks?.has)+(s.risks?.details?' – '+esc(s.risks.details):'')],['Nearest own store',s.ownStoreKm!==''&&s.ownStoreKm!=null?esc(s.ownStoreKm)+' km':'–']])}</div>

const SK=[['Building','bldg'],['Floors','floors'],['Facade width ft','facadeW'],['Facade height ft','facadeH'],['HVAC / exhaust / fresh air installation feasible?','ductFan'],['HVAC / exhaust / fresh air notes','ductFanNote'],['Back door','backDoor'],['Signage visibility','signage'],['Blocking facade','obstruct'],['Waterlogging','waterlog'],['Waterlogging source','waterlogNote'],['Seats indoor','seatIn'],['Seats outdoor','seatOut'],['Outdoor seating permitted','outdoorOk'],['Median','median'],['U-turn m','uturn'],['Parking 2W','parkTw'],['Parking car','parkCar'],['Parking slots','parkSlots'],['Last tenant','lastTenant'],['Stay months','lastStay'],['Why left','whyLeft'],['Vacant months','vacant'],['Direct competition nearby','directNearby'],['Indirect nearby','indirectTypes'],['Openings/closures','changes'],['Own store km','ownStoreKm']];
function csv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"', j=v=>Array.isArray(v)?v.join(', '):v;
  const C=[['Site',s=>s.meta?.site],['Site ID',s=>s.id],['Address',s=>s.meta?.address],['Site location',s=>s.meta?.location],['Maps pin',s=>s.meta?.maps],
   ['Visit date',(s,v)=>v.date],['Visit time',(s,v)=>v.time],['Day type',(s,v)=>v.dayType],['BD executive',(s,v)=>v.bd],
   ['Footfall morning',(s,v)=>v.footfall?.morning],['Footfall lunch',(s,v)=>v.footfall?.lunch],['Footfall evening',(s,v)=>v.footfall?.evening],['Footfall dinner',(s,v)=>v.footfall?.dinner],
   ['Main footfall',(s,v)=>j(v.mainFootfall)],['Frontage issues',(s,v)=>j(v.frontage)],
   ['Evening safety',(s,v)=>v.safety],['Visit notes',(s,v)=>v.visitNotes],['Photo count',(s,v)=>(v.photos||[]).length],['Folder link',(s,v)=>v.driveLink],
   ...SK.map(([h,k])=>[h,s=>j(s[k])]),
   ['Nearby tenants (shop | sqft | rent | source)',s=>(s.tenants||[]).map(t=>TEN_FIELDS.map(f=>t[f.k]??'').join(' | ')).join('\n')],
   ['Generators',s=>(s.generators||[]).map(k=>GENERATORS.find(g=>g.k===k)?.l||k).join(', ')],
   ...GENERATORS.map(g=>[g.l+' details',s=>((s.gen||{})[g.k]||[]).map(r=>g.fields.map(f=>r[f.k]??'').join(' | ')).join('\n')]),
   ['Competitors (name | type | km | ADS | monthly | delivery% | dine-in% | source)',s=>(s.competitors||[]).map(c=>COMP_FIELDS.map(f=>c[f.k]??'').join(' | ')).join('\n')],
   ['Upcoming changes',s=>s.risks?.has],['Change details',s=>s.risks?.details]];
  const lines=[C.map(c=>q(c[0])).join(',')];
  sites.forEach(s=>visitsOf(s.id).forEach(v=>lines.push(C.map(c=>q(c[1](s,v))).join(','))));
  return lines.join('\n');
}

    const val = c==='generators' ? GENERATORS.find(g=>g.l===t.value).k : t.value;
    arr = t.checked ? [...new Set([...arr,val])] : arr.filter(x=>x!==val);

});

const WEB_APP_URL='https://script.google.com/macros/s/AKfycbxo5_XdZDeaypulwaA5O2JKhDUpdWnb7KXISSlFP-1sBZc3roSPl4deYKvMl0LbDTI/exec';
const configured=()=>WEB_APP_URL.startsWith('https://');
let memKey='';
function askKey(){
  return new Promise(res=>{
    const d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50';
    d.innerHTML='<div style="background:var(--surface);color:var(--ink);padding:18px;border-radius:14px;width:min(320px,90vw);display:flex;flex-direction:column;gap:10px"><b>Team access code</b><input type="password" id="ak" autocomplete="off" style="font:16px sans-serif;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)"><button class="btn primary" id="akb" type="button">Continue</button></div>';
    document.body.appendChild(d);
    const go=()=>{const v=d.querySelector('#ak').value.trim();if(!v)return;d.remove();res(v);};
    d.querySelector('#akb').onclick=go;
    d.querySelector('#ak').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  });
}
async function accessKey(){
  if(memKey)return memKey;
  let k='';try{k=localStorage.getItem('recce-key')||'';}catch(e){}
  if(!k){k=await askKey();try{localStorage.setItem('recce-key',k);}catch(e){}}
  memKey=k;return k;
}
const forgetKey=()=>{memKey='';try{localStorage.removeItem('recce-key');}catch(e){}};
async function api(action,payload){
  let r,txt,j;
  const key=await accessKey();
  try{r=await fetch(WEB_APP_URL,{method:'POST',body:JSON.stringify({action,key,...payload})});}
  catch(e){throw new Error('Cannot reach the web app. Check the URL ends in /exec and access is set to Anyone.');}
  txt=await r.text();
  try{j=JSON.parse(txt);}catch(e){console.error(txt);throw new Error('Web app returned a page, not data. Redeploy as a new version and authorise Drive.');}
  if(!j.ok){if(j.error==='bad_key')forgetKey();throw new Error(j.error);}
  return j;
}
async function loadAll(){
  if(!configured())return;
  try{
    const r=await fetch(WEB_APP_URL+'?action=all&key='+encodeURIComponent(await accessKey()));
    const j=await r.json();
    if(!j.ok)throw new Error(j.error);
    sites=j.sites;visits=j.visits;renderList();
    if(S.mode==='Repeat visit'&&!S.siteId&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName))keep();
  }catch(e){
    document.getElementById('listMeta').textContent=e.message==='bad_key'?'Wrong access code. Reload and try again.':'Could not load submissions. Reload to try again.';
  }
}

/* ---------- photos ---------- */
const toB64=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(b);});
async function shrink(f){
  if(!/^image\//.test(f.type))return f;
  try{
    const bm=await createImageBitmap(f),sc=Math.min(1,1600/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
  }catch(e){return f;}
}
let cameraStream=null;
async function openLiveCamera(){
  if(!configured()){toast('Set the web app URL first.');return;}
  if(!navigator.mediaDevices?.getUserMedia){toast('Camera access is not supported here. Use Choose photos / videos.');return;}
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:#111e;display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.innerHTML='<div style="background:#fff;color:#111;border-radius:16px;padding:16px;width:min(680px,100%);display:grid;gap:12px"><video autoplay playsinline style="width:100%;max-height:65vh;background:#111;border-radius:10px;object-fit:contain"></video><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" data-camera-cancel>Cancel</button><button type="button" data-camera-shot>Capture photo</button></div><p style="margin:0;font-size:12px">Allow camera permission when prompted.</p></div>';
  document.body.appendChild(overlay);
  const video=overlay.querySelector('video');
  const stop=()=>{if(cameraStream){cameraStream.getTracks().forEach(tr=>tr.stop());cameraStream=null;}overlay.remove();};
  overlay.querySelector('[data-camera-cancel]').addEventListener('click',stop);
  overlay.addEventListener('click',e=>{if(e.target===overlay)stop();});
  try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=cameraStream;await video.play();}
  catch(err){stop();toast('Could not open camera. Check browser permission and use HTTPS.');return;}
  overlay.querySelector('[data-camera-shot]').addEventListener('click',async()=>{
    if(!video.videoWidth){toast('Camera is still starting. Try again.');return;}
    const canvas=document.createElement('canvas');const scale=Math.min(1,1600/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.85));if(!blob){toast('Could not capture photo.');return;}
    const shot=new File([blob],`site-photo-${Date.now()}.jpg`,{type:'image/jpeg'});const captureBtn=overlay.querySelector('[data-camera-shot]');captureBtn.disabled=true;captureBtn.textContent='Uploading…';
    try{const r=await api('upload',{site:S.meta.site,name:shot.name,type:shot.type,data:await toB64(shot)});S.photos.push({id:r.id,name:shot.name,type:shot.type});saveDraft();stop();keep();toast('Photo captured and uploaded.');}
    catch(err){captureBtn.disabled=false;captureBtn.textContent='Capture photo';console.error(err);toast('Upload failed: '+err.message);}
  });
}
document.addEventListener('click',e=>{const b=e.target.closest('#open-camera');if(!b)return;e.preventDefault();e.stopPropagation();openLiveCamera();},true);

form.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='f-edit'){S.editSite=t.checked;saveDraft();keep();return;}
  if(t.id==='f-files'){
    if(!configured()){toast('Set the web app URL first.');return;}
    const fs=[...t.files],hint=t.closest('.q')?.querySelector('.hint')||t.parentElement.querySelector('.hint');let i=0;
    t.disabled=true;
    for(const f of fs){
      i++;
      if(!/^image\//.test(f.type)&&f.size>20*1024*1024){toast(f.name+' is over 20 MB. Paste a folder link instead.');continue;}
      hint.textContent=`Uploading ${i}/${fs.length}…`;
      try{
        const b=await shrink(f),type=b.type||f.type;
        const r=await api('upload',{site:S.meta.site,name:f.name,type,data:await toB64(b)});
        S.photos.push({id:r.id,name:f.name,type});
      }catch(err){console.error(err);toast('Upload failed: '+err.message);}
    }
    saveDraft();keep();
  }
});
form.addEventListener('click',e=>{
  const p=e.target.dataset.ph;if(!p)return;
  S.photos=S.photos.filter(x=>x.id!==p);saveDraft();keep();
});
document.getElementById('list').addEventListener('click',e=>{
  const b=e.target.closest('button.open');if(!b)return;
  const id=b.dataset.id;openSet.has(id)?openSet.delete(id):openSet.add(id);renderList();
});
document.getElementById('v-list').addEventListener('click',loadAll);

/* ---------- submit ---------- */
function filled(o){return o&&Object.values(o).some(v=>String(v??'').trim()!=='');}
function cleaned(){
  const c=JSON.parse(JSON.stringify(S));const gen={};
  c.generators.forEach(k=>{gen[k]=(c.gen[k]||[]).filter(filled);});
  c.gen=gen;c.competitors=c.competitors.filter(filled);c.tenants=c.tenants.filter(filled);
  if(c.risks.has!=='Yes')c.risks.details='';
  return c;
}
document.getElementById('submitBtn').addEventListener('click',async()=>{
  const errEl=document.getElementById('formErr'),rep=S.mode==='Repeat visit',miss=[];
  if(!S.meta.bd.trim())miss.push('BD executive');
  if(rep&&!S.siteId)miss.push('site');
  if(!rep&&!S.meta.site.trim())miss.push('site name');
  if((!rep||S.editSite)&&!S.meta.address.trim())miss.push('site address');
  if((!rep||S.editSite)&&!S.meta.location.trim())miss.push('site location / area');
  if(ready&&!String(S.meta.maps||'').trim())miss.push('Google Maps pin');
  if(!S.meta.date)miss.push('visit date');
  if(!S.dayType)miss.push('visit day');
  if(ready){
    if(!S.footfall.morning)miss.push('Section B: morning footfall');
    if(!S.footfall.lunch)miss.push('Section B: lunch footfall');
    if(!S.footfall.evening)miss.push('Section B: evening footfall');
    if(!S.footfall.dinner)miss.push('Section B: dinner footfall');
    if(!S.mainFootfall.length)miss.push('Section B: main footfall');
    if(!S.frontage.length)miss.push('Section B: frontage issues');
    if(!S.safety)miss.push('Section B: evening safety and lighting');
  }
  if(!rep){
    if(!S.generators.length)miss.push('at least one demand generator');
    if(S.facadeW==='')miss.push('facade width');
    if(!S.floors.length)miss.push('floor');
  }
  if(miss.length){if(errEl){errEl.hidden=false;errEl.textContent='Fill in: '+miss.join(', ')+'.';errEl.scrollIntoView({block:'center'});}return;}
  if(errEl)errEl.hidden=true;
  if(!configured()){toast('Set the web app URL in the page first.');return;}
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting…';
  try{
    const c=cleaned(),day=S.dayType;
    const site={...pick(c,SITE_KEYS),meta:{site:c.meta.site,address:c.meta.address,location:c.meta.location,maps:c.meta.maps}};
    const visit={bd:c.meta.bd,date:c.meta.date,time:c.meta.time,...pick(c,VISIT_KEYS)};
    await api('submit',{rep,siteId:S.siteId,editSite:S.editSite,site,visit});
    S=blank();saveDraft();render();scrollTo(0,0);
    toast(rep?'Visit submitted.':`Submitted. ${day==='Weekday'?'Weekend':'Weekday'} visit still to do.`);
    loadAll();
  }catch(e){
    toast(e.message==='bad_key'?'Wrong access code. Tap Submit to enter it again.':'Submit failed: '+e.message);
  }finally{btn.disabled=false;btn.textContent='Submit';}
});

/* ---------- CSV download ---------- */
document.getElementById('exportBtn').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv()],{type:'text/csv'}));
  a.download=`site-recces-${today()}.csv`;a.click();URL.revokeObjectURL(a.href);
});

const statusEl=document.getElementById('status');
if(!configured())statusEl.textContent='Setup needed: paste the web app URL into the page.';
try{render();}catch(e){
  console.error(e);
  try{localStorage.removeItem('recce-draft-v2');}catch(_){}
  S=blank();
  try{render();}catch(e2){document.getElementById('form').innerHTML='<p class="err" style="padding:12px">Form failed to load: '+esc(e2.message)+'</p>';}
}
loadAll();
</script>
